name: Build Macroquad APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # نصب صریح پلتفرم android-29 که ابزار به آن نیاز دارد
      - name: Install Android Platform 29
        run: |
          yes | sdkmanager "platforms;android-29"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: cargo quad-apk build --release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android/release/apk/*.apk