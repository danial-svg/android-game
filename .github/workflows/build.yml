name: Build Macroquad APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 25.2.9519653

      - name: Install Android Platform 29
        run: |
          yes | sdkmanager "platforms;android-29"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Remove incompatible Cargo.lock
        run: rm -f Cargo.lock
        
      - name: Build APK
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME
          echo "Using NDK_HOME: $NDK_HOME"
          cargo quad-apk build --release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android/release/apk/*.apk