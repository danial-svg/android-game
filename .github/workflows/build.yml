name: Build Macroquad APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: notfl3/cargo-apk

    steps:
      # تشخیص خودکار: اگه git از قبل توی ایمیج هست ازش استفاده کن،
      # وگرنه با هر پکیج‌منیجری که در دسترس بود نصبش کن
      - name: Ensure git is available
        run: |
          if command -v git >/dev/null 2>&1; then
            echo "git is already installed: $(git --version)"
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y git
          elif command -v pacman >/dev/null 2>&1; then
            sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf
            pacman -Sy --noconfirm git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git
          elif command -v yum >/dev/null 2>&1; then
            yum install -y git
          else
            echo "No known package manager found and git is missing." >&2
            cat /etc/os-release 2>/dev/null || true
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Remove incompatible Cargo.lock
        run: rm -f Cargo.lock

      - name: Build APK
        run: cargo quad-apk build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android-artifacts/release/apk/*.apk