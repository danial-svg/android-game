name: Build Macroquad APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: notfl3/cargo-apk

    steps:
      # ایمیج notfl3/cargo-apk بیس مینیمالی داره، پس اول git رو نصب می‌کنیم
      # تا actions/checkout بتونه ریپازیتوری رو clone کنه
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Remove incompatible Cargo.lock
        run: rm -f Cargo.lock

      - name: Build APK
        run: cargo quad-apk build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android-artifacts/release/apk/*.apk