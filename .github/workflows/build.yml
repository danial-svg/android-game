name: Build Macroquad APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 29
        run: |
          yes | sdkmanager "platforms;android-29"

      # دانلود و تنظیم مستقیم نسخه سازگار NDK (نسخه r25c)
      - name: Download and Setup NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Remove incompatible Cargo.lock
        run: rm -f Cargo.lock
        
      - name: Build APK
        run: |
          echo "Using NDK_HOME: $NDK_HOME"
          cargo quad-apk build --release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android/release/apk/*.apk